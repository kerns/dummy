name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        testbench: ['^10.0', '^11.0']
    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, dom, xml, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer require --dev 'orchestra/testbench:${{ matrix.testbench }}' --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer lint
      - run: composer test -- --display-all-issues
      - run: composer audit --locked
